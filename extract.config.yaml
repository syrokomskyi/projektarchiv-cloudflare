forgePlugin: false
projectDir: packages/projektarchiv-cloudflare
destName: projektarchiv-cloudflare
standalone: true

workspacePrefixes:
  - "@warpgogol/"
stripScopes:
  - "@warpgogol/"
preservePackages:
  - "@warpgogol/projektarchiv-cloudflare"
  - "@warpgogol/projektarchiv-core"
  - "@warpgogol/projektarchiv-operations"
packageManager: pnpm

ci:
  provider: github-actions
  publish: true
  nodeVersion: 24
  provenance: true

ignoreDirs:
  - .turbo
  - node_modules

excludePathSegments:
  - .npmrc
  - pnpm-lock.yaml
  - tests
  - testing

postProcess:
  - action: delete
    path: pnpm-lock.yaml

git:
  remote: git@github.com:syrokomskyi/projektarchiv-cloudflare.git
  autoPush: true
  # RFC-1252/repo-extract >=1.4.0: non-fast-forward push after history
  # transfer reconciles via fetch + merge -s ours + retry. Never force-push.
  autoReconcile: true
